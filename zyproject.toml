[package]
name = "numpy"
version = "0.3.0"
zyen = ">=0.3.4"
entry = "src/lib.zy"

[build]
default-target = "lib"
target-dir = "target"

[targets.lib]
kind = "c-source"
entry = "src/lib.zy"
output-name = "zyen_numpy"

[targets.test-basic]
kind = "bin"
entry = "tests/basic.zy"
output-name = "numpy-test"

[targets.example-basic]
kind = "bin"
entry = "examples/basic.zy"
output-name = "numpy-example"

[dependencies]
